<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Income vs CPI</title>
        <!-- Self-apply the page-wide theme BEFORE the chart's JS reads its colors -->
        <script>
          try {
            var t = localStorage.getItem("pricedout-theme") || "light";
            document.documentElement.setAttribute("data-theme", t);
          } catch (e) {}
        </script>
        <link rel="preconnect" href="https://api.fontshare.com">
        <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="container">
            <h1>Average Income vs Consumer Price Index (2000-2024)</h1>
            <p class="description">
                This chart compares the cumulative percent change in average household income 
                and the Consumer Price Index (CPI) from 2000 to 2024, highlighting the growing 
                gap between inflation and wage growth.
            </p>
            <svg id="chart"></svg>
        </div>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="./main.js"></script>
    </body>
</html>
